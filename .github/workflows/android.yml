name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Build React App
      run: npm run build

    - name: Initialize Android Platform
      run: npx cap add android

    - name: Inject SMS Permissions and Plugin Registration
      run: |
        # Inject SMS Permissions into AndroidManifest.xml
        sed -i 's|</manifest>|    <uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n</manifest>|' android/app/src/main/AndroidManifest.xml

        # Register SMSInboxReaderPlugin in MainActivity.java
        MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
        sed -i 's|import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport com.capacitor.sms.reader.SMSInboxReaderPlugin;|' "$MAIN_ACTIVITY"
        sed -i 's|public class MainActivity extends BridgeActivity {}|public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(SMSInboxReaderPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}|' "$MAIN_ACTIVITY"

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: expense-tracker-lite-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
